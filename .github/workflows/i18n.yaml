on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  i18n-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v6

      - name: 🏗 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Extract Lingui catalogs
        run: npm run i18n:extract
        working-directory: apps/mobile

      - name: 🧪 Verify catalogs are up to date
        env:
          LOCALES_DIR: apps/mobile/src/locales
        run: |
          # Intent-to-add so a catalog file extract creates (not just edits) shows up in the diff.
          git add --intent-to-add -- "$LOCALES_DIR"
          if ! git diff --quiet -- "$LOCALES_DIR"; then
            echo "::error::Lingui catalogs are stale. Run 'npm run i18n:extract' in apps/mobile and commit the result."
            echo "::group::Catalog diff"
            git diff -- "$LOCALES_DIR"
            echo "::endgroup::"
            exit 1
          fi
          echo "Lingui catalogs are up to date."
