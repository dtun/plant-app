# Automated Claude review on every non-draft PR from this repo (issue #32).
#
# Required setup (a maintainer does this once; nothing here is committed):
#
#   1. Repository secret `ANTHROPIC_API_KEY`
#      Settings → Secrets and variables → Actions → New repository secret.
#      Name: ANTHROPIC_API_KEY. Value: a Claude API key from https://platform.claude.com.
#      Alternative: a Claude subscription token from `claude setup-token`, saved as
#      `CLAUDE_CODE_OAUTH_TOKEN`; then swap the `anthropic_api_key:` line below for
#      `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}` and update the
#      check step to read that secret instead.
#
#   2. Install the Claude GitHub App on this repository: https://github.com/apps/claude.
#      With no `github_token` input, the action posts comments as that app, which is
#      why the job needs `id-token: write`. To skip installing the app, pass
#      `github_token: ${{ secrets.GITHUB_TOKEN }}` to the action instead; comments then
#      appear as github-actions[bot].
#
# Until the secret exists the job runs but skips the review step with a notice and
# exits green, so an unconfigured fork or clone is not blocked by a red check. Secrets
# cannot be referenced in `if:` directly; the check step exposes the secret as a
# step-level env var and later steps gate on its output, per
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions#using-secrets-in-a-workflow
#
# Action inputs and the review example this follows:
# https://code.claude.com/docs/en/github-actions
# https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, bot authors, and fork PRs (forks cannot read secrets anyway).
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: 🔑 Check for ANTHROPIC_API_KEY
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping Claude review. See the comment at the top of .github/workflows/claude-review.yaml."
          fi

      - name: 🏗 Setup repo
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📝 Load review prompt
        if: steps.secret.outputs.present == 'true'
        id: prompt
        run: |
          {
            echo "body<<KEEPTEND_PROMPT_EOF"
            cat .github/claude-review-prompt.md
            echo "KEEPTEND_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 🤖 Review with Claude
        if: steps.secret.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ steps.prompt.outputs.body }}
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
