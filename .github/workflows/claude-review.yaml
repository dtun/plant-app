# Claude review of a PR from this repo, requested by adding the `claude-review` label
# (issue #32).
#
# Adding the label reviews the PR. While the label stays on, each push re-reviews it,
# and a labelled draft is reviewed when it is marked ready. Remove the label to stop.
# Fork PRs are never reviewed (forks cannot read secrets anyway).
#
# Required setup (a maintainer does this once; nothing here is committed):
#
#   1. Label `claude-review`
#      `gh label create claude-review --description "Pull request label to request a Claude review." --color 11181c`
#
#   2. Repository secret `ANTHROPIC_API_KEY`
#      Settings → Secrets and variables → Actions → New repository secret.
#      Name: ANTHROPIC_API_KEY. Value: a Claude API key from https://platform.claude.com.
#      Alternative: a Claude subscription token from `claude setup-token`, saved as
#      `CLAUDE_CODE_OAUTH_TOKEN`; then swap the `anthropic_api_key:` line below for
#      `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}` and update the
#      check step to read that secret instead.
#
#   3. Install the Claude GitHub App on this repository: https://github.com/apps/claude.
#      With no `github_token` input, the action posts comments as that app, which is
#      why the job needs `id-token: write`. To skip installing the app, pass
#      `github_token: ${{ secrets.GITHUB_TOKEN }}` to the action instead; comments then
#      appear as github-actions[bot].
#
# Until the secret exists the job runs but skips the review step with a notice and
# exits green, so an unconfigured fork or clone is not blocked by a red check. Secrets
# cannot be referenced in `if:` directly; the check step exposes the secret as a
# step-level env var and later steps gate on its output, per
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions#using-secrets-in-a-workflow
#
# `--max-turns` bounds a runaway run below the 20-minute job timeout. A turn is one
# tool call (a file read, a `gh pr diff`, one inline comment). Overrunning the cap fails
# the check even when the review finished; a multi-commit PR touching a seam, a
# provider, a screen, tests, and docs needed 34 turns (#64), so the cap sits at 50, which
# is roughly six minutes at the observed pace.
#
# Each run posts inline comments for line-specific findings plus one summary comment.
# The prompt writes the summary with `gh pr comment --edit-last --create-if-none`, so a
# later push updates the previous summary in place rather than adding another; inline
# comments from earlier runs stay where they are. `use_sticky_comment` is deliberately
# not set: the action only honours it in tag mode, and passing `prompt` selects agent
# mode, where it does nothing.
#
# Action inputs and the review example this follows:
# https://code.claude.com/docs/en/github-actions
# https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - ready_for_review
      - reopened

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Run only when the `claude-review` label is on the PR. On a `labeled` event the
    # label being added must be that one, so adding an unrelated label to an
    # already-labelled PR does not start another review. Drafts wait until they are
    # marked ready; fork PRs are skipped because they cannot read secrets.
    if: |
      contains(github.event.pull_request.labels.*.name, 'claude-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: 🔑 Check for ANTHROPIC_API_KEY
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping Claude review. See the comment at the top of .github/workflows/claude-review.yaml."
          fi

      - name: 🏗 Setup repo
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 📝 Load review prompt
        if: steps.secret.outputs.present == 'true'
        id: prompt
        run: |
          {
            echo "body<<KEEPTEND_PROMPT_EOF"
            cat .github/claude-review-prompt.md
            echo "KEEPTEND_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 🤖 Review with Claude
        if: steps.secret.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ steps.prompt.outputs.body }}
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
